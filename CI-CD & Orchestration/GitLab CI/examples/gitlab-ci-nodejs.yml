# GitLab CI — Full Pipeline for a Node.js Application
# Place this file at the root of your repository as: .gitlab-ci.yml

stages:
  - install
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: "20"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE

# ─── Cache node_modules across jobs ─────────────
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

# ─── Install ────────────────────────────────────
install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ─── Lint ───────────────────────────────────────
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script:
    - npm run lint

# ─── Unit Tests ─────────────────────────────────
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_DB: testdb
    DATABASE_URL: postgresql://testuser:testpass@db:5432/testdb
  script:
    - npm test -- --coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    reports:
      junit: test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# ─── Build Docker Image ────────────────────────
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main

# ─── Deploy to Staging ─────────────────────────
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - ssh $STAGING_USER@$STAGING_HOST "docker pull $DOCKER_IMAGE:latest && docker compose up -d"
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - main

# ─── Deploy to Production (Manual) ─────────────
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    - ssh $PROD_USER@$PROD_HOST "docker pull $DOCKER_IMAGE:$CI_COMMIT_SHA && docker compose up -d"
  environment:
    name: production
    url: https://example.com
  when: manual                # Requires click in GitLab UI
  only:
    - main
