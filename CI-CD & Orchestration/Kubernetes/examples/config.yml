# Kubernetes — Secrets and ConfigMap
# Apply with: kubectl apply -f config.yml

# ConfigMap — Non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_BASE_URL: "https://api.example.com"

---
# Secret — Sensitive data (base64 encoded)
# Generate base64: echo -n "mypassword" | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
type: Opaque
data:
  username: YWRtaW4=            # base64 of "admin"
  password: c2VjcmV0cGFzcw==   # base64 of "secretpass"

---
# Using ConfigMap and Secret in a Pod
apiVersion: v1
kind: Pod
metadata:
  name: app-pod
spec:
  containers:
    - name: app
      image: my-app:1.0.0
      envFrom:
        - configMapRef:
            name: app-config     # Injects ALL keys as env vars
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: password
